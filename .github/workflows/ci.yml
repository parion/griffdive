name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Every green push to main lands on staging, so merges accumulate there for
  # hands-on testing before a production release. No reviewer gate; the
  # separate app and volume keep it isolated from production data.
  deploy-staging:
    name: Deploy staging
    needs: [ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://griffdive-staging.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --config fly.staging.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_TOKEN }}
      # Staging is password-protected (server/middleware/staging-auth.ts); the
      # same user:password lives as a secret on the staging environment.
      - name: Smoke check
        run: curl -fsS -u "$STAGING_AUTH" --retry 5 --retry-delay 5 --retry-connrefused --retry-max-time 120 https://griffdive-staging.fly.dev/ > /dev/null
        env:
          STAGING_AUTH: ${{ secrets.STAGING_AUTH }}

  # Batched releases, started by hand: pushes to main never deploy to production. When the
  # accumulated merges are ready, run this workflow from main (Actions → CI/CD
  # → Run workflow); it re-verifies the batch, then the production environment
  # (Settings → Environments) holds the run until its required reviewer
  # approves, and one release deploys. The environment reference is also what
  # creates the GitHub deployment record — the feed for the "production
  # deployments" UI and the in-app changelog (useChangelog). A per-merge deploy
  # job would queue a waiting run for every merge and the next merge's
  # cancellation stamped each one as a failed deployment.
  deploy:
    name: Deploy production
    needs: [ci, e2e]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      # A second dispatch replaces a pending release request; don't dispatch
      # while a release is already deploying.
      group: production
      cancel-in-progress: true
    environment:
      name: production
      url: https://griffdive.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke check
        run: curl -fsS --retry 5 --retry-delay 5 --retry-connrefused --retry-max-time 120 https://griffdive.fly.dev/ > /dev/null
