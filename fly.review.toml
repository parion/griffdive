# Pull-request review-app config for .github/workflows/preview.yml. Deployed as
# pr-<n>-parion-griffdive — the workflow overrides `app` via --app.
app = 'griffdive-pr'
primary_region = 'ams'

[build]

[env]
  HOST = '0.0.0.0'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # Previews sleep when idle and wake on the next request — no always-on cost.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Single instance, same as prod. No volume is mounted here on purpose: PR apps
# would collide on a shared volume, so room state is ephemeral on the container
# filesystem (prod persists on `griffdive_data`).
[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
