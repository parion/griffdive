# fly.toml app configuration file generated for griffdive on 2026-09-05T18:43:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'griffdive'
primary_region = 'ams'

[build]

[env]
  HOST = '0.0.0.0'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Scraped by Fly every 15s into the managed Prometheus (dashboards at
# fly-metrics.net). Served by server/plugins/metrics.ts on a port that is
# never registered in [http_service], so it is not publicly reachable.
[metrics]
  port = 9091
  path = "/metrics"

# Room state + saved dives live on this volume (Nitro `fs-lite` writes to
# `.data/rooms` under the app's /app workdir), so sessions survive deploys.
# Create it once before the first deploy that declares the mount:
#   fly volumes create griffdive_data --region ams --size 1
[[mounts]]
  source = 'griffdive_data'
  destination = '/app/.data'

# Single instance only: a volume binds to one machine, and live peers live in an
# in-process directory. Scaling beyond one machine splits squads across
# processes — move both storage and the peer directory to Redis first.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
